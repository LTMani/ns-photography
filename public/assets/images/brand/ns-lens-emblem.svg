<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <!-- Ultra-Luxe Metallic Gold Gradients -->
    <radialGradient id="lensBackground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="65%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9df" />
      <stop offset="20%" stop-color="#f5d677" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#9a7510" />
      <stop offset="90%" stop-color="#f5df8e" />
      <stop offset="100%" stop-color="#fff9df" />
    </linearGradient>

    <linearGradient id="goldGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8014" />
      <stop offset="30%" stop-color="#ffd966" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#fff5cc" />
    </linearGradient>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#d4af37" flood-opacity="0.4" />
    </filter>

    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Circular Deep Black Metallic Lens Face -->
  <circle cx="1024" cy="1024" r="1020" fill="url(#lensBackground)" stroke="#1a1c22" stroke-width="4" />

  <!-- Outer Knurled Aperture Ring -->
  <circle cx="1024" cy="1024" r="980" fill="none" stroke="url(#goldShine)" stroke-width="18" />
  <circle cx="1024" cy="1024" r="945" fill="none" stroke="url(#goldGleam)" stroke-width="8" stroke-dasharray="14,10" opacity="0.8" />

  <!-- Secondary Inner Gold Ring -->
  <circle cx="1024" cy="1024" r="910" fill="none" stroke="url(#goldShine)" stroke-width="12" />

  <!-- Camera Body Silhouette Graphic at top -->
  <g filter="url(#subtleDrop)" opacity="0.85">
    <path d="M 724 530 L 894 530 Q 924 530 944 500 L 974 455 Q 994 425 1024 425 Q 1054 425 1074 455 L 1104 500 Q 1124 530 1154 530 L 1324 530 A 30 30 0 0 1 1354 560 L 1354 750 A 30 30 0 0 1 1324 780 L 724 780 A 30 30 0 0 1 694 750 L 694 560 A 30 30 0 0 1 724 530 Z"
          fill="none" stroke="url(#goldShine)" stroke-width="12" />
    <circle cx="1270" cy="600" r="14" fill="url(#goldGleam)" />
  </g>

  <!-- ==================== PROMINENT "NS" CALLIGRAPHY ==================== -->
  <g filter="url(#emblemGlow)">
    <!-- Main Calligraphic "N" -->
    <path d="M 710 1140 
             C 680 1140, 660 1115, 670 1075 
             C 690 970, 750 740, 790 620 
             C 800 585, 830 570, 860 570 
             C 890 570, 915 590, 905 630 
             L 810 1020 
             C 870 900, 970 710, 1030 620 
             C 1050 585, 1090 570, 1120 585 
             C 1150 600, 1160 635, 1145 675 
             L 1025 1110 
             C 1010 1160, 970 1180, 930 1170 
             C 900 1155, 890 1125, 905 1080 
             L 975 830 
             L 760 1130 
             C 745 1140, 730 1140, 710 1140 Z" 
          fill="url(#goldShine)" />

    <!-- Flourish Swirl on Left of N -->
    <path d="M 600 860 C 650 860 700 930 680 1000 C 660 1050 610 1060 575 1025 C 540 990 550 905 630 870" 
          fill="none" 
          stroke="url(#goldGleam)" 
          stroke-width="22" 
          stroke-linecap="round" />

    <!-- Main Calligraphic "S" -->
    <path d="M 1120 1130 
             C 1150 1195, 1230 1245, 1335 1230 
             C 1460 1215, 1545 1120, 1525 995 
             C 1505 895, 1395 835, 1270 770 
             C 1170 720, 1130 665, 1145 585 
             C 1165 490, 1255 435, 1375 455 
             C 1450 470, 1500 520, 1485 590 
             C 1470 640, 1420 650, 1385 625 
             C 1355 605, 1360 570, 1395 540 
             C 1335 520, 1265 540, 1245 595 
             C 1230 650, 1265 695, 1350 735 
             C 1475 790, 1620 860, 1595 1030 
             C 1570 1195, 1430 1310, 1260 1295 
             C 1145 1280, 1060 1205, 1085 1115 
             C 1100 1065, 1145 1060, 1175 1085 
             C 1205 1115, 1180 1145, 1120 1130 Z" 
          fill="url(#goldShine)" />

    <!-- Terminal Flourish Loop on S -->
    <path d="M 1440 1200 C 1550 1230 1675 1160 1650 1035 C 1620 920 1510 920 1470 975" 
          fill="none" 
          stroke="url(#goldGleam)" 
          stroke-width="20" 
          stroke-linecap="round" />
  </g>

  <!-- ==================== PHOTOGRAPHY ==================== -->
  <g filter="url(#subtleDrop)">
    <text x="1024" y="1460" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="108" 
          font-weight="900" 
          letter-spacing="42" 
          fill="url(#goldShine)">
      PHOTOGRAPHY
    </text>

    <!-- Ornamental Center Divider -->
    <line x1="360" y1="1540" x2="880" y2="1540" stroke="url(#goldGleam)" stroke-width="6" stroke-linecap="round" />
    <line x1="1168" y1="1540" x2="1688" y2="1540" stroke="url(#goldGleam)" stroke-width="6" stroke-linecap="round" />
    <path d="M 1024 1515 L 1049 1540 L 1024 1565 L 999 1540 Z" fill="url(#goldShine)" />
    <circle cx="940" cy="1540" r="8" fill="url(#goldGleam)" />
    <circle cx="1108" cy="1540" r="8" fill="url(#goldGleam)" />
  </g>

  <!-- ==================== TAGLINE ==================== -->
  <g filter="url(#subtleDrop)">
    <text x="1024" y="1630" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="24" 
          fill="#f3e5ab">
      CAPTURING TIMELESS MEMORIES
    </text>

    <text x="1024" y="1710" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', ui-monospace, monospace" 
          font-size="38" 
          font-weight="600" 
          letter-spacing="12" 
          fill="url(#goldGleam)">
      9848760197 &#8226; 9848523630
    </text>
  </g>
</svg>
